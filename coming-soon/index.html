<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jeff Clark Artworks</title>
<meta name="description" content="Original acrylic-on-canvas paintings by Jeff Clark, Portland, Oregon. New site coming October 2026.">
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500&family=Alegreya+Sans:wght@400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1F1E24;--surface:#2A2931;--text:#D4D4D4;--heading:#C8C2DB;
  --accent:#B290C5;--link:#5191A8;--deco:#006593;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--text);
  font-family:'Alegreya Sans',sans-serif;
  display:flex;flex-direction:column;min-height:100vh;
  overflow-x:hidden;
}
a{color:var(--link);text-decoration:none;transition:color .15s}
a:hover{color:var(--accent)}
::selection{background:var(--deco);color:var(--heading)}
header{
  padding:clamp(20px,2.4vw,36px) clamp(20px,3vw,48px);
  font-family:Jost,sans-serif;font-weight:500;
  font-size:clamp(13px,1.1vw,16px);letter-spacing:.28em;color:var(--heading);
  white-space:nowrap;
}
main{
  flex:1;position:relative;
  padding:clamp(40px,6vw,96px) clamp(20px,3vw,48px) clamp(60px,8vw,120px);
  display:flex;flex-direction:column;justify-content:flex-end;
}
.circle{
  position:absolute;right:clamp(-120px,-8vw,-40px);top:clamp(-40px,-2vw,0px);
  width:clamp(220px,38vw,560px);height:clamp(220px,38vw,560px);
  border-radius:50%;background:var(--deco);z-index:0;
}
h1{
  position:relative;z-index:1;margin:0;
  font-family:Jost,sans-serif;font-weight:500;
  font-size:clamp(72px,16.5vw,238px);line-height:.8;letter-spacing:-.045em;
  color:var(--heading);
}
h1 span{color:var(--accent)}
@media (max-width:759px){
  h1{display:flex;flex-direction:column;font-size:30vw;line-height:.82}
}
.note{
  position:relative;z-index:1;
  margin:clamp(36px,4vw,56px) 0 0;max-width:62ch;
  font-size:clamp(17px,1.3vw,19px);line-height:1.6;
  padding-top:22px;border-top:1px solid var(--deco);
}
.note strong{font-weight:400;color:var(--accent)}
.label{
  display:inline-block;margin-top:28px;
  font-family:Jost,sans-serif;font-weight:500;font-size:12px;letter-spacing:.24em;
  text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--accent);
}
footer{
  background:var(--surface);
  padding:28px clamp(20px,3vw,48px);
  display:flex;flex-wrap:wrap;align-items:baseline;gap:10px 32px;
  font-size:14px;line-height:1.5;
}
footer .name{color:var(--heading)}
footer .copy{margin-left:auto}
</style>
</head>
<body>
<header>JEFF CLARK ARTWORKS</header>
<main>
  <div class="circle" aria-hidden="true"></div>
  <h1>UGLY <span>beauty</span></h1>
  <p class="note"><strong>A new site is on its way.</strong> Original acrylic-on-canvas paintings by Jeff Clark, Portland, Oregon. The full catalog opens here in October 2026.</p>
  <a class="label" href="mailto:jjdclark@gmail.com">Contact Jeff</a>
</main>
<footer>
  <span class="name">Jeff Clark Artworks</span>
  <span>Portland, Oregon</span>
  <a href="mailto:jjdclark@gmail.com">jjdclark@gmail.com</a>
  <span class="copy">&copy; 2026 Jeff Clark</span>
</footer>
</body>
</html>
